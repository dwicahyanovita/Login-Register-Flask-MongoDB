<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/static/css/styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

<div class="split-container">
  <div class="left-image">
    <img src="/static/img/image.png" alt="Register Image">
  </div>

  <div class="right-form card">
    <h1 class="center mb-2">Register Akun</h1>
    <p class="center text-muted mb-4">Silakan isi data di bawah ini untuk membuat akun baru</p>

    <form name="register_form">
      <div class="input-group mb-3">
        <span class="input-group-text">@</span>
        <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
      </div>
      <div class="input-group mb-3">
        <input type="email" name="email" class="form-control" placeholder="Email" required>
        <span class="input-group-text">@example.com</span>
      </div>
      <div class="input-group mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>

      <div class="success error--hidden text-success text-center mb-2" style="display:none;"></div>
      <div class="error error--hidden text-danger text-center mb-2" style="display:none;"></div>

      <button type="submit" class="btn btn-primary rounded-pill d-block mx-auto mt-2">Daftar</button>
    </form>

    <div class="center mt-3">
      <p>Sudah punya akun? <a href="/">Login sekarang</a></p>
    </div>
  </div>
</div>

<script src="/static/js/jquery.js"></script>
<script src="/static/js/scripts.js"></script>
</body>
</html>
